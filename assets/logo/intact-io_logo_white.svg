<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg" viewBox="40 75 120 105">
  <title>Intact-io Connected Nodes Logo (White)</title>
  <defs>
    <linearGradient id="orangeGradW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgb(255,200,80);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgb(255,170,40);stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGradW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6aa3ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4080ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Connecting lines -->
  <line x1="100" y1="100" x2="140" y2="140" stroke="rgb(255,200,80)" stroke-width="2" opacity="0.7"/>
  <line x1="100" y1="100" x2="60" y2="140" stroke="#6aa3ff" stroke-width="2" opacity="0.7"/>
  <line x1="100" y1="100" x2="100" y2="160" stroke="rgb(255,200,80)" stroke-width="2" opacity="0.7"/>

  <!-- Central orange node (lighter for dark bg) -->
  <circle cx="100" cy="100" r="20" fill="url(#orangeGradW)" stroke="#fff" stroke-width="2"/>

  <!-- Blue nodes (lighter for dark bg) -->
  <circle cx="140" cy="140" r="15" fill="url(#blueGradW)" stroke="#fff" stroke-width="2"/>
  <circle cx="60" cy="140" r="15" fill="url(#blueGradW)" stroke="#fff" stroke-width="2"/>
  <circle cx="100" cy="160" r="15" fill="url(#blueGradW)" stroke="#fff" stroke-width="2"/>

  <!-- Center accent dot -->
  <circle cx="100" cy="100" r="8" fill="#fff"/>
</svg>
